seed: 20260727
cohort_year: 2012
expected_counts:
  accepted: 27157
  rejected: 206161

data:
  accepted_path: data/accepted_2007_to_2018Q4.csv.gz
  rejected_path: data/rejected_2007_to_2018Q4.csv.gz
  prepared_path: artifacts/prepared/lendingclub_2012.parquet
  chunksize: 100000
  features:
    numeric: [requested_amount, dti, risk_score, employment_years]
    categorical: [state, zip3, purpose]

evaluation:
  n_folds: 5
  alphas: [0.90, 0.95]
  gamma_grid: [1.0, 1.25, 1.5, 2.0, 3.0, 5.0, 8.0, 12.0]
  p1_clip: [0.01, 0.99]
  propensity_clip: [0.02, 0.98]
  confidence_level: 0.95
  models: [logistic, gradient_boosting, conservative_logistic]
  nuisance_outcome_model: gradient_boosting
  nuisance_propensity_model: gradient_boosting
  conservative_default_weight: 2.0

xgboost:
  n_estimators: 450
  max_depth: 5
  learning_rate: 0.04
  min_child_weight: 10.0
  subsample: 0.85
  colsample_bytree: 0.85
  reg_lambda: 2.0
  device: cuda
  n_jobs: 8

part_b:
  gamma0: 3.0
  target_selected_fraction: 0.45
  repetitions: 20
  adaptive_model: gradient_boosting
  adaptive_rounds: 8
  batch_fraction_hidden: 0.02
  test_fraction: 0.20
  target_width: 0.10
  policies:
    - tiv_per_cost
    - random
    - uncertainty
    - low_propensity
    - predicted_loss
    - sensitivity_width
  audit_cost_amount_weight: 0.0

output:
  directory: artifacts
